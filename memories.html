<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Memory Wall — The Giles of Adair County</title>
<meta name="description" content="Stories, sayings and memories of the Giles family, shared by the family.">
<meta property="og:title" content="The Giles Family Memory Wall"><meta property="og:description" content="Stories, sayings and memories of the Giles family, shared by the family."><meta property="og:image" content="assets/img/og-card.png"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#efe4c9">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/img/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/fonts.css"><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/memories.css">
</head>
<body class="memories-page">
<main id="main">
  <header class="page-hero">
    <div class="wrap">
      <div class="eyebrow">The Memory Wall</div>
      <h1>Pin a Memory</h1>
      <p>A sound, a saying, a supper table, a drive down Ky 76. Pin your memory of anyone in the family here, so the next generation can read it. Posting uses the same family passcode as the tree editor.</p>
    </div>
  </header>
  <section class="wrap mw-wrap">
    <form class="mw-form" id="mw-form" autocomplete="off">
      <h2>Add a memory</h2>
      <label>Your name <input id="mw-name" maxlength="60" placeholder="e.g. Cousin Sarah"></label>
      <label>Who is it about? <select id="mw-about"><option value="">The whole family</option></select></label>
      <label>Your memory <textarea id="mw-text" maxlength="1200" rows="6" required placeholder="I remember…"></textarea><small id="mw-count">0 / 1200</small></label>
      <label>Family passcode <input id="mw-pass" type="password" autocomplete="off" required></label>
      <button class="btn solid" type="submit" id="mw-send">Pin it to the wall</button>
      <p class="mw-msg" id="mw-msg" role="status" aria-live="polite"></p>
    </form>
    <div>
      <div class="mw-filter"><label>Show memories of <select id="mw-show"><option value="">everyone</option></select></label></div>
      <div class="mw-wall" id="mw-wall" aria-live="polite"><p class="mw-empty">Loading memories…</p></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script><script src="assets/js/family-sync.js"></script><script type="family/deferred" data-src="assets/js/common.js"></script><script type="family/deferred" data-src="assets/js/memories.js"></script>
</body>
</html>
